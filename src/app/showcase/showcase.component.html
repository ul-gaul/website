<!-- HEADER -->
<app-header [backgroundImg]="siteContent.content().images['showcaseHeader']" [title]="('showcase.title' | translate)"></app-header>

<section class="section">
  <div class="container">
    <div class="nav-tabs-navigation">
      <div class="nav-tabs-wrapper">
        <ul ngbNav #nav="ngbNav" class="nav-tabs justify-content-center">
          @for (model of siteContent.content().showcaseModels; track model.id) {
          <li [ngbNavItem]="model.id">
            <button ngbNavLink>{{ model.label }}</button>
            <ng-template ngbNavContent>
              <p>{{ model.description }}</p>
              <iframe [src]="siteContent.resourceUrl(model.url)" frameborder="0" scrolling="no"></iframe>
            </ng-template>
          </li>
          }
        </ul>
        <div [ngbNavOutlet]="nav" class="mt-2"></div>
      </div>
    </div>
  </div>
</section>
